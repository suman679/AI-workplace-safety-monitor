services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safevision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safevision_dev}
      POSTGRES_DB: safevision
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safevision"]
      interval: 5s
      retries: 10

  backend:
    build: { context: ./backend, dockerfile: ../docker/backend.Dockerfile }
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://safevision:${POSTGRES_PASSWORD:-safevision_dev}@postgres:5432/safevision
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  frontend:
    build: { context: ./frontend, dockerfile: ../docker/frontend.Dockerfile }
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  pgdata:
